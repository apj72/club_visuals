name: Application checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test tools
        run: |
          python -m pip install pytest pytest-subtests
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Python backend and route checks
        run: python -m pytest -q --ignore=test_server.py
      - name: JavaScript playback and show checks
        run: node --test test_*.cjs test_*.js ui-redesign/show-models.test.cjs
