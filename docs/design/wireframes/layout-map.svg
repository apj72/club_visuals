<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1150" viewBox="0 0 1440 1150">
<defs><style>text{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#27362d}.k{font-size:11px;letter-spacing:2px;fill:#596b5d}.title{font-size:32px;font-weight:500}.label{font-size:13px}.small{font-size:11px;fill:#56645a}.head{font-size:16px;font-weight:600}.num{font-size:12px;font-weight:700;fill:white}.box{fill:#fff;stroke:#9ba99b;stroke-width:1}.soft{fill:#e6ebe1;stroke:#9ba99b}.line{stroke:#c0c8bd;fill:none}.body{font-size:13px;fill:#526153}</style><pattern id="hatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="16" height="16" fill="#f2f3ed"/><path d="M0 0V16" stroke="#e0e4d9"/></pattern></defs>
<rect width="1440" height="1150" fill="#f7f7f2"/>
<text x="44" y="40" class="k">CLUB VISUALS / STRUCTURAL WIREFRAMES / PROPOSAL 01</text>
<text x="44" y="88" class="title">Prepare privately. Send deliberately.</text><text x="44" y="118" class="body">A shared control model across Mac and iPad. The video stays central; detailed tools stay contextual.</text>
<text x="44" y="166" class="head">MAC / LANDSCAPE WORKSPACE</text>
<rect x="44" y="186" width="920" height="552" rx="10" class="box"/>
<rect x="44" y="186" width="920" height="44" rx="10" class="soft"/><text x="64" y="214" class="label">CLUB VISUALS</text><text x="245" y="214" class="label">Prepare</text><text x="341" y="214" class="small">Playlists</text><text x="437" y="214" class="small">Library</text><text x="523" y="214" class="small">Auto Perform</text><text x="804" y="214" class="small">Capture · Setup</text>
<rect x="44" y="230" width="920" height="61" class="soft"/><circle cx="67" cy="259" r="12" fill="#435d44"/><text x="63" y="263" class="num">1</text><text x="91" y="252" class="label">PLAYING ON MAC / clip name</text><text x="91" y="273" class="small">Owner · Engine connection · Output state</text><text x="433" y="263" class="small">Open output · Mac fullscreen · Next · Stop</text><rect x="799" y="242" width="145" height="36" rx="5" fill="#d3dfc8" stroke="#6b815b"/><text x="823" y="265" class="label">Send to Mac ↗</text>
<text x="66" y="326" class="head">Prepare a look</text><text x="66" y="348" class="small">Only Send to Mac changes the show.</text>
<rect x="66" y="366" width="594" height="260" fill="url(#hatch)" stroke="#9ba99b"/><path d="M66 366 660 626M660 366 66 626" class="line"/><circle cx="94" cy="393" r="12" fill="#435d44"/><text x="90" y="397" class="num">2</text><rect x="245" y="473" width="237" height="43" fill="#f7f7f2"/><text x="280" y="499" class="label">PRIVATE VIDEO PREVIEW</text>
<rect x="66" y="626" width="594" height="42" class="box"/><text x="83" y="652" class="label">▶ Play</text><path d="M160 646H485" stroke="#9ba99b" stroke-width="3"/><circle cx="250" cy="646" r="5" fill="#435d44"/><text x="509" y="652" class="small">Muted · 00:24</text>
<rect x="681" y="313" width="262" height="398" rx="6" class="box"/><circle cx="705" cy="338" r="12" fill="#435d44"/><text x="701" y="342" class="num">3</text><text x="727" y="343" class="head">Contextual inspector</text><path d="M681 362H943" class="line"/><text x="697" y="389" class="small">Layout / Colour / VFX / 3D text</text><rect x="699" y="411" width="226" height="40" rx="5" class="soft"/><text x="714" y="436" class="small">Text or selected control</text><rect x="699" y="466" width="226" height="94" rx="5" class="soft"/><text x="748" y="517" class="small">Material / options</text><text x="699" y="593" class="small">Common adjustment</text><path d="M700 612H924" stroke="#a5afa0" stroke-width="4"/><circle cx="821" cy="612" r="6" fill="#435d44"/><text x="699" y="653" class="label">▸ Advanced details</text><text x="699" y="688" class="small">Explicit save scope</text>
<circle cx="79" cy="697" r="12" fill="#435d44"/><text x="75" y="701" class="num">4</text><rect x="103" y="684" width="103" height="34" class="soft"/><rect x="216" y="684" width="103" height="34" class="soft"/><rect x="329" y="684" width="103" height="34" class="soft"/><rect x="442" y="684" width="103" height="34" class="soft"/><text x="566" y="705" class="small">Library →</text>
<text x="1024" y="166" class="head">IPAD / PORTRAIT</text><rect x="1024" y="186" width="372" height="706" rx="14" class="box"/>
<rect x="1036" y="199" width="348" height="43" rx="6" class="soft"/><text x="1053" y="225" class="label">CLUB VISUALS</text><text x="1265" y="225" class="small">Capture · Setup</text>
<text x="1047" y="266" class="small">Prepare / Playlists / Library / Auto Perform</text><rect x="1036" y="282" width="348" height="111" class="soft"/><circle cx="1059" cy="307" r="12" fill="#435d44"/><text x="1055" y="311" class="num">1</text><text x="1081" y="309" class="label">MAC STATUS / OWNER / ENGINE</text><text x="1050" y="339" class="small">Open output · Mac fullscreen · Next</text><rect x="1050" y="350" width="111" height="32" class="box"/><text x="1067" y="371" class="label">Stop Mac</text><rect x="1171" y="350" width="199" height="32" fill="#d3dfc8" stroke="#6b815b"/><text x="1220" y="371" class="label">Send to Mac ↗</text>
<text x="1046" y="426" class="head">Prepare a look</text><rect x="1044" y="443" width="332" height="187" fill="url(#hatch)" stroke="#9ba99b"/><path d="M1044 443 1376 630M1376 443 1044 630" class="line"/><rect x="1103" y="519" width="214" height="34" fill="#f7f7f2"/><text x="1135" y="540" class="label">PRIVATE PREVIEW</text><rect x="1044" y="630" width="332" height="38" class="box"/><text x="1058" y="654" class="small">▶ Play ─────────── Muted</text><rect x="1044" y="684" width="100" height="46" class="soft"/><rect x="1159" y="684" width="100" height="46" class="soft"/><rect x="1274" y="684" width="100" height="46" class="soft"/>
<rect x="1044" y="747" width="332" height="124" rx="6" class="box"/><circle cx="1068" cy="773" r="12" fill="#435d44"/><text x="1064" y="777" class="num">5</text><text x="1090" y="778" class="label">Inspector moves below preview</text><text x="1060" y="815" class="small">Layout / Colour / VFX / 3D text</text><rect x="1060" y="829" width="299" height="27" class="soft"/>
<text x="44" y="791" class="k">WHY THESE AREAS MATTER</text>
<text x="44" y="826" class="head">1 / Persistent performance controls</text><text x="44" y="851" class="body">Owner, engine and output are separate states. The Mac bar</text><text x="44" y="873" class="body">stays pinned as the document scrolls. It is a status display,</text><text x="44" y="895" class="body">not a live program video feed.</text>
<text x="522" y="826" class="head">2 / Private canvas</text><text x="522" y="851" class="body">Library choices, edits and transport stay local.</text><text x="522" y="873" class="body">Only an explicit Send replaces Mac playout.</text><text x="522" y="895" class="body">Preview fullscreen never means Mac fullscreen.</text>
<text x="44" y="946" class="head">3 / Progressive detail</text><text x="44" y="971" class="body">One inspector, four sections. Keep common choices visible;</text><text x="44" y="993" class="body">expand advanced controls in context.</text>
<text x="522" y="946" class="head">4 / The next look is close by</text><text x="522" y="971" class="body">A compact shelf links preparation to the full library.</text><text x="522" y="993" class="body">Tag review uses its own independent player.</text>
<text x="1024" y="946" class="head">5 / Comfortable portrait editing</text><text x="1024" y="971" class="body">Stack panels; keep touch controls large.</text><text x="1024" y="993" class="body">One main scroll surface.</text>
<path d="M44 1041H1396" class="line"/><text x="44" y="1080" class="k">PREPARE → AUDITION → SEND TO MAC → CONTINUE PREPARING</text><text x="44" y="1111" class="small">Structural diagrams are schematic. See the responsive prototype for actual breakpoints, dimensions and control states.</text>
</svg>
